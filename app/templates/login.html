<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Giriş — GDG Mail Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        fontFamily: { sans: ['"Google Sans"', 'Roboto', 'Arial', 'sans-serif'] },
        colors: {
          base: '#202124', mantle: '#292a2d', surface0: '#35363a',
          text: '#e8eaed', blue: '#8ab4f8', red: '#f28b82', mauve: '#8ab4f8',
          overlay0: '#9aa0a6',
        }
      }}
    }
  </script>
  <style>body { background-color: #202124; color: #e8eaed; font-family: 'Google Sans', Roboto, Arial, sans-serif; }</style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="bg-mantle border border-surface1 rounded-2xl p-10 w-full max-w-sm shadow-lg text-center">
    <div class="text-4xl mb-4">✉️</div>
    <h1 class="text-2xl font-bold text-text mb-2">GDG Mail Admin</h1>
    <p class="text-sm text-overlay0 mb-8">Yalnızca yetkili adminler erişebilir.</p>

    {% if error == 'wrong_credentials' %}
    <p class="text-red text-sm mb-4 bg-surface0 rounded-lg px-3 py-2">
      ❌ Kullanıcı adı veya şifre hatalı.
    </p>
    {% elif error == 'too_many_attempts' %}
    <p class="text-red text-sm mb-4 bg-surface0 rounded-lg px-3 py-2">
      🚫 Çok fazla hatalı deneme. Lütfen 15 dakika sonra tekrar deneyin.
    </p>
    {% endif %}

    <form method="post" action="/login" class="space-y-4 text-left">
      <div>
        <label class="block text-sm text-overlay0 mb-1">Kullanıcı Adı</label>
        <input
          type="text"
          name="username"
          autocomplete="username"
          required
          class="w-full bg-surface0 text-text rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue"
        />
      </div>
      <div>
        <label class="block text-sm text-overlay0 mb-1">Şifre</label>
        <input
          type="password"
          name="password"
          autocomplete="current-password"
          required
          class="w-full bg-surface0 text-text rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-blue hover:opacity-90 text-mantle font-semibold py-3 px-4 rounded-xl transition"
      >
        Giriş Yap
      </button>
    </form>
  </div>
</body>
</html>
