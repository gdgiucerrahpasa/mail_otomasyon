<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GDG Mail Otomasyon{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Google Sans"', 'Roboto', 'Arial', 'sans-serif'],
            mono: ['"Roboto Mono"', 'monospace'],
          },
          colors: {
            base:     '#202124',
            mantle:   '#292a2d',
            crust:    '#202124',
            surface0: '#35363a',
            surface1: '#5f6368',
            overlay0: '#9aa0a6',
            subtext0: '#bdc1c6',
            text:     '#e8eaed',
            lavender: '#8ab4f8',
            blue:     '#8ab4f8',
            sapphire: '#33475c',
            teal:     '#78d9ec',
            green:    '#81c995',
            yellow:   '#fdd663',
            peach:    '#fcad70',
            red:      '#f28b82',
            mauve:    '#8ab4f8',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    body { background-color: #202124; color: #e8eaed; font-family: 'Google Sans', Roboto, Arial, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #202124; }
    ::-webkit-scrollbar-thumb { background: #5f6368; border-radius: 4px; }
    .log-ok   { color: #81c995; }
    .log-err  { color: #f28b82; }
    .log-warn { color: #fdd663; }
    .log-info { color: #8ab4f8; }
  </style>
</head>
<body class="min-h-screen flex">

  <!-- Mobile top bar -->
  <header class="md:hidden fixed top-0 inset-x-0 z-20 flex items-center gap-3 px-4 py-3 bg-mantle border-b border-surface1">
    <button onclick="toggleSidebar(true)" aria-label="Menü" class="p-1 -ml-1 text-text">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <span class="text-text font-medium text-base">Mail Admin</span>
  </header>

  <!-- Backdrop (mobile only, shown while sidebar is open) -->
  <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="hidden md:hidden fixed inset-0 z-30 bg-black/50"></div>

  <!-- Sidebar -->
  <nav id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-64 md:w-56 min-h-screen bg-mantle border-r border-surface1 flex flex-col py-6 px-4 shrink-0 -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
    <div class="mb-8 flex items-center gap-2.5">
      <span class="flex gap-0.5 shrink-0">
        <span class="w-2 h-2 rounded-full bg-blue"></span>
        <span class="w-2 h-2 rounded-full bg-red"></span>
        <span class="w-2 h-2 rounded-full bg-yellow"></span>
        <span class="w-2 h-2 rounded-full bg-green"></span>
      </span>
      <span class="text-text font-medium text-base">Mail Admin</span>
    </div>
    <ul class="space-y-1 flex-1">
      <li>
        <a href="/" class="flex items-center gap-2 px-3 py-2 rounded-full hover:bg-surface0 transition text-text text-sm
          {% if request.url.path == '/' %}bg-sapphire text-lavender font-medium{% endif %}">
          🚀 Dashboard
        </a>
      </li>
      <li>
        <a href="/drafts" class="flex items-center gap-2 px-3 py-2 rounded-full hover:bg-surface0 transition text-text text-sm
          {% if '/drafts' in request.url.path %}bg-sapphire text-lavender font-medium{% endif %}">
          ✉️ Taslaklar
        </a>
      </li>
      <li>
        <a href="/logs" class="flex items-center gap-2 px-3 py-2 rounded-full hover:bg-surface0 transition text-text text-sm
          {% if '/logs' in request.url.path %}bg-sapphire text-lavender font-medium{% endif %}">
          📋 Loglar
        </a>
      </li>
      <li>
        <a href="/settings" class="flex items-center gap-2 px-3 py-2 rounded-full hover:bg-surface0 transition text-text text-sm
          {% if '/settings' in request.url.path %}bg-sapphire text-lavender font-medium{% endif %}">
          ⚙️ Ayarlar
        </a>
      </li>
    </ul>
    <div class="mt-auto text-xs text-overlay0">
      <p class="truncate">{{ user }}</p>
      <a href="/logout" class="text-red hover:underline mt-1 inline-block">Çıkış</a>
    </div>
  </nav>

  <!-- Main -->
  <main class="flex-1 p-4 pt-20 md:p-8 overflow-auto">
    {% block content %}{% endblock %}
  </main>

  <script>
    function toggleSidebar(open) {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      sidebar.style.transform = open ? 'translateX(0)' : '';
      backdrop.classList.toggle('hidden', !open);
    }
  </script>

</body>
</html>
