<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GDG Mail Otomasyon{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            base:     '#1e1e2e',
            mantle:   '#181825',
            crust:    '#11111b',
            surface0: '#313244',
            surface1: '#45475a',
            overlay0: '#6c7086',
            subtext0: '#a6adc8',
            text:     '#cdd6f4',
            lavender: '#b4befe',
            blue:     '#89b4fa',
            sapphire: '#74c7ec',
            teal:     '#94e2d5',
            green:    '#a6e3a1',
            yellow:   '#f9e2af',
            peach:    '#fab387',
            red:      '#f38ba8',
            mauve:    '#cba6f7',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    body { background-color: #1e1e2e; color: #cdd6f4; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #181825; }
    ::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }
    .log-ok   { color: #a6e3a1; }
    .log-err  { color: #f38ba8; }
    .log-warn { color: #f9e2af; }
    .log-info { color: #89b4fa; }
  </style>
</head>
<body class="min-h-screen flex">

  <!-- Sidebar -->
  <nav class="w-56 min-h-screen bg-mantle flex flex-col py-6 px-4 shrink-0">
    <div class="mb-8">
      <span class="text-mauve font-bold text-lg">✉️ Mail Admin</span>
    </div>
    <ul class="space-y-1 flex-1">
      <li>
        <a href="/" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-surface0 transition text-text text-sm
          {% if request.url.path == '/' %}bg-surface0 text-lavender{% endif %}">
          🚀 Dashboard
        </a>
      </li>
      <li>
        <a href="/drafts" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-surface0 transition text-text text-sm
          {% if '/drafts' in request.url.path %}bg-surface0 text-lavender{% endif %}">
          ✉️ Taslaklar
        </a>
      </li>
      <li>
        <a href="/logs" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-surface0 transition text-text text-sm
          {% if '/logs' in request.url.path %}bg-surface0 text-lavender{% endif %}">
          📋 Loglar
        </a>
      </li>
      <li>
        <a href="/settings" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-surface0 transition text-text text-sm
          {% if '/settings' in request.url.path %}bg-surface0 text-lavender{% endif %}">
          ⚙️ Ayarlar
        </a>
      </li>
    </ul>
    <div class="mt-auto text-xs text-overlay0">
      <p class="truncate">{{ user }}</p>
      <a href="/logout" class="text-red hover:underline mt-1 inline-block">Çıkış</a>
    </div>
  </nav>

  <!-- Main -->
  <main class="flex-1 p-8 overflow-auto">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
